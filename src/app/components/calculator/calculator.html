<section id="calculator" class="mx-auto max-w-6xl px-4 py-8">
  <h2 class="text-2xl font-bold text-gray-800">حاسبة الذهب</h2>
  <p class="mt-1 text-gray-500">اختر العيار وأدخل الوزن لتعرف القيمة التقديرية</p>

  <div class="mt-6 grid gap-6 md:grid-cols-2">

    <div class="rounded-2xl bg-white p-6 shadow">
      <label for="karat" class="block text-sm font-medium text-gray-700">العيار</label>
      <select id="karat" [(ngModel)]="selectedKarat"
              class="mt-1 w-full rounded-lg border border-gray-300 p-2">
        @for (k of karats; track k) {
          <option [ngValue]="k">عيار {{ k }}</option>
        }
      </select>

      <label for="weight" class="mt-4 block text-sm font-medium text-gray-700">الوزن بالجرام</label>
      <input id="weight" type="number" min="0" [(ngModel)]="weight"
             class="mt-1 w-full rounded-lg border border-gray-300 p-2" />

      <button (click)="calculate()"
              class="mt-4 w-full rounded-lg bg-amber-600 py-2 font-bold text-white hover:bg-amber-700">
        احسب
      </button>
    </div>

    <div class="flex items-center justify-center rounded-2xl bg-amber-50 p-6 text-center">
      @if (total() !== null) {
        <div>
          <p class="text-sm text-gray-500">القيمة التقديرية</p>
          <p class="mt-2 text-4xl font-bold text-amber-600">{{ total()?.toFixed(2) }} ر.ع</p>
        </div>
      } @else {
        <p class="text-gray-400">أدخل الوزن واضغط "احسب" لعرض النتيجة</p>
      }
    </div>

  </div>
</section>
